{% extends 'base.html' %}
{% block title %}{{ title }} - HealthSphere{% endblock %}
{% block content %}
<div class="hs-card" style="max-width: 800px; margin: 0 auto;">
    <div class="hs-card-header">
        <h2>{{ title }}</h2>
    </div>
    <div class="hs-card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="hs-form-actions mt-4">
                <button type="submit" class="hs-btn hs-btn-primary">Save Facility</button>
                <a href="{% url 'facilities:list' %}" class="hs-btn hs-btn-outline-sm">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
