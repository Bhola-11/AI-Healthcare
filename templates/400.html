{% extends 'base.html' %}
{% block title %}400 Bad Request - HealthSphere{% endblock %}
{% block content %}
<div class="hs-card text-center" style="max-width: 600px; margin: 4rem auto; padding: 2rem;">
    <h1 style="font-size: 4rem; color: var(--hs-primary);">400</h1>

    </div>
</div>
{% endblock %}
