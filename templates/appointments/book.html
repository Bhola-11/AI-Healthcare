{% extends 'base.html' %}
{% block title %}Book Consultation Appointment - HealthSphere{% endblock %}
{% block content %}
<div class="hs-card" style="max-width: 700px; margin: 0 auto;">
    <div class="hs-card-header">
        <h2>Schedule Physician Consultation</h2>
    </div>
    <div class="hs-card-body">
        <form method="post">
            {% csrf_token %}
            <div class="hs-form-grid">
                {{ form.as_p }}
            </div>
            <div class="hs-form-actions mt-4">
                <button type="submit" class="hs-btn hs-btn-primary">Confirm & Reserve Slot</button>
                <a href="{% url 'appointments:list' %}" class="hs-btn hs-btn-outline-sm">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
