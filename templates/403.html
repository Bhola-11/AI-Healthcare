{% extends 'base.html' %}
{% block title %}403 Access Forbidden - HealthSphere{% endblock %}
{% block content %}
<div class="hs-card text-center" style="max-width: 600px; margin: 4rem auto; padding: 2rem;">
    <h1 style="font-size: 4rem; color: var(--hs-primary);">403</h1>
    <h2>Access Forbidden</h2>
    <p class="hs-text-muted mt-4">You do not have the necessary healthcare security clearance for this resource.</p>
    <div class="mt-4">
        <a href="{% url 'accounts:dashboard' %}" class="hs-btn hs-btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
