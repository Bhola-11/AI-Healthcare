# Nginx Reverse Proxy & SSL Termination for HealthSphere Enterprise
upstream healthsphere_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name healthsphere.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name healthsphere.local;

    ssl_certificate /etc/ssl/certs/healthsphere.crt;
    ssl_certificate_key /etc/ssl/private/healthsphere.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;
    keepalive_timeout 65;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /app/mediafiles/;
        internal; # Protected PHI document download routing
    }

    location / {
        proxy_pass http://healthsphere_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
